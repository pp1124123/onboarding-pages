<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; style-src 'unsafe-inline' blob:; font-src blob:; img-src blob:; frame-src blob:; form-action 'none'; base-uri 'none'">
<title>KECC 온보딩 입장</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#122f4c,#066f99);color:#f4f7fd;font:16px system-ui,sans-serif}main{width:min(100%,410px);padding:32px;border-radius:18px;background:#152642;box-shadow:0 18px 55px #0d223e65}h1{font-size:1.5rem;margin:8px 0 24px}p{margin:0;color:#c5deef}.brand{font-weight:800;letter-spacing:.13em;color:#96dafa;font-size:.75rem}input,button{width:100%;padding:12px;border-radius:8px;font:inherit}input{margin:7px 0 12px;border:1px solid #73b7db;background:#0c182c;color:#fff}button{background:#9edfff;border:0;color:#11263e;font-weight:750;cursor:pointer}input:focus-visible,button:focus-visible{outline:3px solid white;outline-offset:3px}.error{min-height:1.6em;color:#ffd2d2;font-size:.85rem}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
</style>
<script defer src="protected.js"></script><script defer src="unlock.js"></script></head>
<body><main><p class="brand">KECC ONBOARDING</p><h1>사내 직원 전용 페이지</h1><form id="entry"><label for="password">접속 비밀번호</label><input id="password" type="password" autocomplete="off" required maxlength="128"><p id="status" class="error" role="status"></p><button>입장하기</button></form></main></body></html>
